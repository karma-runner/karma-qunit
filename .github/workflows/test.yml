name: Tests

on: [push, pull_request]

env:
  FORCE_COLOR: 2

permissions:
  contents: read

jobs:
  run:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [12, 14, 16, 18, 20, 24, 26]

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # On Node 12-16 and earlier, test with QUnit 2.x instead
      - name: Install older versions
        run: npm install --dev qunit@2.26.0 grunt@1.5.3 sinon@12.0.1 nise@5.1.3
        if: ${{ matrix.node < 18 }}

      - run: npm install

      - run: npm test
